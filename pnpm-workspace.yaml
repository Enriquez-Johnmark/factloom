packages:
  - packages/*
  - apps/*

# Install scripts that are not run. onnxruntime-node's only downloads CUDA provider binaries from a
# NuGet feed; the CPU binaries for every supported platform are in the package. protobufjs's is not
# needed to load the embedding model.
allowBuilds:
  onnxruntime-node: false
  protobufjs: false

# Every shared version is pinned here, once, and exactly. A package.json refers to it with "catalog:".
catalog:
  # The Anthropic API client, used only by apps/mcp-server for the LlmClient. It releases often, so it is pinned and upgraded on purpose.
  "@anthropic-ai/sdk": 1.8.0
  # The local embedding model runtime (Transformers.js), used only by apps/mcp-server for the Embedder. See ADR 0014.
  "@huggingface/transformers": 4.3.2
  # Mutation testing of core, run by hand with `pnpm mutate:core`, never by `pnpm check` (FL-077). Development only.
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  # The MCP server SDK, version 2, used only by apps/mcp-server. See ADR 0016.
  "@modelcontextprotocol/server": 2.4.0
  # The MCP client SDK, for the server's tests only. Development only.
  "@modelcontextprotocol/client": 2.4.0
  # Formatter and linter, including the import rules between packages.
  "@biomejs/biome": 2.6.7
  # Types for better-sqlite3, which ships none. Development only. See Q-82 on its version.
  "@types/better-sqlite3": 9.6.0
  # Types for the Node.js built-ins, on the line of the oldest supported Node.js.
  "@types/node": 22.19.0
  # SQLite driver, synchronous, with FTS5 built in. Version 13.1.1 is the one the spikes ran.
  better-sqlite3: 13.1.1
  # Property-based testing: generated sequences of changes, and generated tool inputs. Development only.
  fast-check: 4.10.2
  # Vector distance functions for SQLite, loaded as an extension. The version the spikes ran.
  sqlite-vec: 0.1.9
  # Type checker. Node.js runs the source directly, so nothing is compiled in development.
  typescript: 7.0.2
  # Test runner.
  vitest: 5.1.0
  # Reads the eval scenario files, which are YAML. Development only.
  yaml: 2.9.1
  # Schemas and validation. Every data type is derived from a Zod schema.
  zod: 4.6.7
