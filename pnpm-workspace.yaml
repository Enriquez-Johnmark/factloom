packages:
  - packages/*
  - apps/*

# Every shared version is pinned here, once, and exactly. A package.json refers to it with "catalog:".
catalog:
  # Formatter and linter, including the import rules between packages.
  "@biomejs/biome": 2.6.7
  # Types for better-sqlite3, which ships none. Development only. See Q-82 on its version.
  "@types/better-sqlite3": 9.6.0
  # Types for the Node.js built-ins, on the line of the oldest supported Node.js.
  "@types/node": 22.19.0
  # SQLite driver, synchronous, with FTS5 built in. Version 13.1.1 is the one the spikes ran.
  better-sqlite3: 13.1.1
  # Property-based testing: generates sequences of changes to check the rules of memory. Development only.
  fast-check: 4.10.2
  # Vector distance functions for SQLite, loaded as an extension. The version the spikes ran.
  sqlite-vec: 0.1.9
  # Type checker. Node.js runs the source directly, so nothing is compiled in development.
  typescript: 7.0.2
  # Test runner.
  vitest: 5.1.0
  # Reads the eval scenario files, which are YAML. Development only.
  yaml: 2.9.1
  # Schemas and validation. Every data type is derived from a Zod schema.
  zod: 4.6.7
